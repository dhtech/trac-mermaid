name: release

# Pushing a tag vX.Y.Z runs the tests, builds the release (build.sh: the
# plugin with the pinned Mermaid in it), tries it in a real Trac
# (tests/smoke.sh) and publishes on a GitHub release:
#
#   trac-mermaid_X.Y.Z.tar.gz
#   SHA256SUMS

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build, try and publish (Debian 13)
    runs-on: ubuntu-latest
    if: github.repository_owner == 'dhtech'
    container: debian:13
    steps:
      - name: What a wiki server has, and what the build needs
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            trac python3-pytest curl openssl ca-certificates git gh
      - uses: actions/checkout@v7
      - name: The tag is the version in the source
        run: |
          version=$(sed -n "s/^__version__ = '\([0-9][0-9.]*\)'$/\1/p" tracmermaid.py)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME}, but tracmermaid.py says version ${version}"; exit 1; }
      - run: python3 -m pytest -q tests
      - run: sh build.sh
      - run: sh tests/smoke.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}" --generate-notes
